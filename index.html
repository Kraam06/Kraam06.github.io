<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="Mark Alejandro A. Carabbacan — personal digital profile">
<title>Mark Alejandro A. Carabbacan</title>
<style>
  :root{--bg:#09090b;--card:#151519;--text:#f7f7f8;--muted:#a7a7b0;--line:#29292f;--accent:#fff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#25252d 0,#0b0b0d 42%,#060607 100%);
       color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
  .wrap{width:min(100% - 28px,520px);margin:0 auto;padding:36px 0 32px}
  .card{background:rgba(18,18,22,.88);border:1px solid var(--line);border-radius:28px;padding:28px 20px 22px;
        box-shadow:0 24px 70px rgba(0,0,0,.45);backdrop-filter:blur(16px)}
  .photo{width:104px;height:104px;border-radius:50%;margin:0 auto 18px;border:2px solid #3a3a42;
        display:grid;place-items:center;background:linear-gradient(145deg,#292930,#101014);overflow:hidden}
  .photo span{font-size:34px;font-weight:700;letter-spacing:-2px}
  h1{text-align:center;font-size:27px;line-height:1.1;margin:0;font-weight:750;letter-spacing:-.7px}
  .role{text-align:center;color:var(--muted);margin:9px 0 7px;font-size:15px}
  .bio{text-align:center;color:#c8c8ce;font-size:14px;margin:0 auto 24px;max-width:390px}
  .buttons{display:grid;gap:11px}
  a.btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:#101012;
         background:#f5f5f5;border-radius:15px;padding:14px 16px;font-weight:650;font-size:15px}
  a.btn.secondary{background:#202025;color:#f5f5f7;border:1px solid #303038}
  .socials{display:flex;gap:10px;margin-top:14px}
  .socials a{flex:1;text-align:center;text-decoration:none;color:#eee;background:#17171c;border:1px solid #2b2b31;
             padding:12px;border-radius:14px;font-size:14px;font-weight:600}
  .footer{text-align:center;color:#66666e;font-size:11px;margin-top:20px}
  .note{margin-top:16px;padding:12px;border:1px dashed #34343b;border-radius:14px;color:#8f8f98;font-size:11px;text-align:center}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="photo" aria-label="Profile photo placeholder"><span>MA</span></div>
    <h1>Mark Alejandro A. Carabbacan</h1>
    <div class="role">Tambay</div>
    <p class="bio">Welcome to my digital profile.</p>

    <div class="buttons">
      <a class="btn" href="tel:+639524584015">📞 Call Me</a>
      <a class="btn" href="sms:+639524584015">💬 Message Me</a>
      <a class="btn" href="mailto:markcarabbacan302003@gmail.com">✉️ Email Me</a>
    </div>

    <div class="socials">
      <a href="https://www.facebook.com/share/19T24EP87q/?mibextid=wwXIfr" target="_blank" rel="noopener">Facebook</a>
      <a href="https://www.instagram.com/mark_carabbacan?stkn=MTRubGs0OTJzN29zeA%3D%3D&utm_source=qr" target="_blank" rel="noopener">Instagram</a>
    </div>

    <div class="note">Replace the “MA” circle with your photo after uploading it.</div>
    <div class="footer">Personal digital card • Mark Alejandro A. Carabbacan</div>
  </section>
</main>
</body>
</html>
